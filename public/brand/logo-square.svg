<svg width="1080" height="1080" viewBox="0 0 1080 1080" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bg" cx="50%" cy="38%" r="75%">
      <stop offset="0%" stop-color="#0d1226"/>
      <stop offset="60%" stop-color="#0a0a1a"/>
      <stop offset="100%" stop-color="#06060f"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#d4af37" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#d4af37" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1080" height="1080" fill="url(#bg)"/>
  <circle cx="540" cy="430" r="260" fill="url(#glow)"/>

  <!-- Mandala mark (concentric rings + rays + core) -->
  <g stroke="#d4af37" fill="none" stroke-linecap="round">
    <circle cx="540" cy="430" r="200" stroke-width="3" opacity="0.45"/>
    <circle cx="540" cy="430" r="150" stroke-width="3" opacity="0.7"/>
    <circle cx="540" cy="430" r="98" stroke-width="3" opacity="0.9"/>
    <!-- rays -->
    <line x1="540" y1="180" x2="540" y2="232" stroke-width="4" opacity="0.7"/>
    <line x1="540" y1="628" x2="540" y2="680" stroke-width="4" opacity="0.7"/>
    <line x1="290" y1="430" x2="342" y2="430" stroke-width="4" opacity="0.7"/>
    <line x1="738" y1="430" x2="790" y2="430" stroke-width="4" opacity="0.7"/>
    <line x1="363" y1="253" x2="400" y2="290" stroke-width="3" opacity="0.5"/>
    <line x1="680" y1="570" x2="717" y2="607" stroke-width="3" opacity="0.5"/>
    <line x1="717" y1="253" x2="680" y2="290" stroke-width="3" opacity="0.5"/>
    <line x1="400" y1="570" x2="363" y2="607" stroke-width="3" opacity="0.5"/>
  </g>
  <circle cx="540" cy="430" r="34" fill="#d4af37"/>

  <!-- Wordmark -->
  <text x="540" y="800" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="118" font-weight="600" fill="#f5efe0" letter-spacing="2">VedicHour</text>
  <text x="540" y="868" text-anchor="middle" font-family="'Courier New', monospace" font-size="34" fill="#d4af37" letter-spacing="8" opacity="0.85">YOUR LIFE, HOUR BY HOUR</text>
</svg>
